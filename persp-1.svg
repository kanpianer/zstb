<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Organic pencil stroke filter -->
    <filter id="p-stroke" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08 0.12" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.85" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <!-- Soft 3D cast shadow behind the paper sheet -->
    <filter id="p-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="1.5" flood-color="#1f1c18" flood-opacity="0.22" />
    </filter>
  </defs>

  <g filter="url(#p-stroke)">
    <!-- 3D Perspective Cast Shadow on desk (transparent background) -->
    <!-- The shadow falls beneath and behind the tilted paper -->
    <path 
      d="M 14 20 
         C 28 17, 42 14, 55 12
         C 56 22, 57 32, 57 41
         C 46 47, 34 53, 21 59
         C 17 46, 15 33, 14 20
         Z" 
      fill="#1c1917" 
      opacity="0.08" 
      transform="translate(1.8, 3.2)"
    />

    <!-- 
      MAIN PAPER BODY (Tilted toward Front-Left in 3D Perspective)
      - Front-Left vertical edge: closest to viewer, tall and prominent (x ~ 10.5..13.5, y ~ 16..55)
      - Back-Right vertical edge: recedes into depth, shorter (x ~ 52..54, y ~ 10..37)
      - Top edge: from (11.5, 16.5) to (52.5, 9.5), with a gentle concave/convex paper curl wave and a torn notch
      - Bottom edge: from (17.5, 55) to (54, 37.5), sweeping upward in perspective
      - Torn details: on top edge near x=26..30 (a natural tear with jagged fiber and crack line)
      - "删除图标右下角的折角": Bottom-right corner at (54, 37.5) is clean and natural, NO fold!
    -->
    <path 
      d="M 11.5 16.8 
         C 18 14.5, 24 12.8, 28 12.2
         L 29.5 15.5
         L 31 11.8
         L 32.5 14
         L 33.8 11.5
         C 40 10.5, 46.5 9.8, 52.8 9.5
         C 53.4 18, 53.8 28, 54.2 37.5
         C 42 43.5, 30 49.5, 17.5 55
         C 15.8 42, 13.5 29, 11.5 16.8
         Z" 
      fill="#FAF7F0" 
      stroke="#24211d" 
      stroke-width="1.35" 
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Subtle paper edge thickness / rim for 3D realism (along bottom-left closer to camera) -->
    <path 
      d="M 11.5 16.8 
         L 11 17.6
         C 13 29.8, 15.3 42.8, 17 55.8
         L 17.5 55
         Z" 
      fill="#DCD6C8" 
      stroke="#24211d" 
      stroke-width="0.5" 
      stroke-linejoin="round"
    />
    <path 
      d="M 17 55.8 
         L 17.5 55
         C 30 49.5, 42 43.5, 54.2 37.5
         L 54 38.2
         C 41.8 44.2, 29.6 50.2, 17 55.8
         Z" 
      fill="#C8C2B3" 
      stroke="#24211d" 
      stroke-width="0.5" 
      stroke-linejoin="round"
    />

    <!-- Secondary sketch line (pencil overlapping double stroke) -->
    <path 
      d="M 12.2 17.5 
         C 18.5 15.2, 24.2 13.5, 27.8 13
         M 34.5 12.2
         C 40.5 11.2, 46.8 10.5, 52.2 10.2
         C 52.8 18.5, 53.2 28, 53.6 37
         C 41.5 43, 29.8 48.8, 18 54.2
         C 16.5 42, 14.2 29.5, 12.2 17.5" 
      fill="none" 
      stroke="#4c4740" 
      stroke-width="0.65" 
      stroke-linecap="round"
      opacity="0.75"
    />

    <!-- Realistic pencil tear crack into the paper -->
    <path d="M 29.5 15.5 L 30 18.8 L 29 21" fill="none" stroke="#24211d" stroke-width="0.85" stroke-linecap="round" />
    <line x1="32.5" y1="14" x2="32" y2="16.5" stroke="#4c4740" stroke-width="0.55" stroke-linecap="round" />
    <line x1="28.5" y1="13.2" x2="29.2" y2="14.8" stroke="#756f66" stroke-width="0.45" />
    <line x1="33.2" y1="12.2" x2="32.8" y2="13.8" stroke="#756f66" stroke-width="0.45" />

    <!-- A small torn nick on the left front edge (y ~ 36) -->
    <path d="M 14.5 35 L 12.8 36.5 L 15 37.8" fill="#FAF7F0" stroke="#24211d" stroke-width="1.1" stroke-linejoin="round" />
    <line x1="12.8" y1="36.5" x2="16.5" y2="36.8" stroke="#24211d" stroke-width="0.7" stroke-linecap="round" />

    <!-- 
      Notebook / drafting pencil guidelines IN PERSPECTIVE!
      Notice: lines converge towards the right vanishing point!
      Left spacing is wider, right spacing is narrower.
    -->
    <g stroke="#686158" stroke-width="0.65" stroke-linecap="round" opacity="0.35">
      <!-- Line 1 -->
      <line x1="15" y1="24" x2="51" y2="15.5" stroke-dasharray="8 2 12 1.5 6 1" />
      <line x1="15.2" y1="24.3" x2="48" y2="16" stroke-width="0.4" opacity="0.25" />

      <!-- Line 2 -->
      <line x1="16" y1="31.5" x2="51.5" y2="21" stroke-dasharray="14 1.5 5 2 8 1" />

      <!-- Line 3 -->
      <line x1="16.8" y1="39" x2="52.2" y2="26.5" stroke-dasharray="6 2 16 1.5 4 1" />

      <!-- Line 4 -->
      <line x1="17.2" y1="46.5" x2="53" y2="32" stroke-dasharray="10 1.5 8 1.5 5 1" />
    </g>

    <!-- Faint graphite sketch shading on the surface showing subtle paper undulation / curvature -->
    <g stroke="#554f46" stroke-width="0.6" stroke-linecap="round" opacity="0.18">
      <path d="M 22 28 C 26 34, 30 40, 34 46" fill="none" stroke-dasharray="2 3" />
      <path d="M 28 24 C 32 30, 36 36, 40 42" fill="none" stroke-dasharray="2 3" />
      <path d="M 34 20 C 38 26, 42 32, 46 38" fill="none" stroke-dasharray="2 3" />
    </g>

    <!-- Faint pencil-drawn compass / quadrant cross mark on the paper surface -->
    <!-- (Paper Strategy / 纸上谈兵 aesthetic in perspective) -->
    <g stroke="#3a3630" stroke-width="0.65" stroke-linecap="round" opacity="0.28">
      <ellipse cx="32" cy="31" rx="9" ry="4.5" transform="rotate(-15 32 31)" fill="none" stroke-dasharray="2 2" />
      <line x1="24" y1="33" x2="40" y2="29" stroke-dasharray="1.5 1.5" />
      <line x1="31" y1="26" x2="33" y2="36" stroke-dasharray="1.5 1.5" />
    </g>
  </g>
</svg>