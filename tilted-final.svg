<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Organic pencil stroke filter for authentic hand-sketched lines -->
    <filter id="pencil-stroke" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08 0.12" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.85" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- Soft graphite shadow cast by the 3D tilted paper sheet (falling to the back-right) -->
    <filter id="tilt-desk-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="2.4" stdDeviation="1.6" flood-color="#1e1b18" flood-opacity="0.28" />
    </filter>
  </defs>

  <g filter="url(#pencil-stroke)">
    <!-- 
      3D Perspective Projected Paper Sheet:
      Tilted towards left-front (整体向左前方倾斜):
      - Left edge is closer to camera (longer, steeper perspective)
      - Right edge recedes into depth
      - NO fold on the bottom-right corner!
      - Subtle natural paper curl along the surface (轻微卷曲)
      - Subtly torn edges / notch (一点破损)
      - Pencil drawn style (由铅笔绘制)
      - Transparent background (背景透明)
    -->

    <!-- Ambient graphite shadow on transparent background -->
    <path 
      d="M 12 17 
         L 51 12.5 
         L 55 49 
         L 16 57 
         Z" 
      fill="#1c1917" 
      opacity="0.09" 
      transform="translate(1.8, 2.2)"
    />

    <!-- Main Paper Body -->
    <g filter="url(#tilt-desk-shadow)">
      <!-- Base paper surface & primary graphite contour -->
      <path 
        d="M 10.5 14.8 
           C 16 13.5, 22 12.5, 27 12
           L 28.5 15.2
           L 30.2 11.5
           L 31.8 13.5
           L 33 11.2
           C 40 10.2, 46 9.6, 52 9.2
           C 52.8 18, 53.8 32, 54.8 47.8
           C 46 49.5, 36 51.5, 26 53.8
           L 24.8 52
           L 23.5 54.2
           C 19.5 55.2, 16 56, 13.8 56.8
           C 12.8 45, 12 33, 11.2 27
           L 9.5 25.5
           L 11.4 24
           C 11 20, 10.7 17, 10.5 14.8
           Z" 
        fill="#FAF7F0" 
        stroke="#22201d" 
        stroke-width="1.35" 
        stroke-linejoin="round"
        stroke-linecap="round"
      />

      <!-- Secondary sketch line (overlapping pencil double-stroke) -->
      <path 
        d="M 11.2 15.4 
           C 16.5 14.2, 22.2 13.2, 26.5 12.6
           M 33.5 11.8
           C 40.2 10.8, 46.2 10.2, 51.5 9.8
           C 52.2 18.5, 53.2 32, 54.2 47.2
           C 46 49, 36.2 51, 26.2 53.2
           M 23 53.8
           C 19.5 54.8, 16 55.6, 14.2 56.2
           C 13.2 45, 12.5 33, 11.8 27.5
           M 11.8 23.5
           C 11.5 20, 11.2 17.2, 11 15.4" 
        fill="none" 
        stroke="#4a453f" 
        stroke-width="0.65" 
        stroke-linecap="round"
        opacity="0.75"
      />

      <!-- 3D Perspective Ruled guidelines on paper surface -->
      <g stroke="#6d665e" stroke-width="0.65" stroke-linecap="round" opacity="0.32">
        <line x1="16" y1="22" x2="48" y2="17.2" stroke-dasharray="8 2 12 1.5 6 1" />
        <line x1="17" y1="30" x2="49" y2="24.8" stroke-dasharray="14 1.5 6 2 8 1" />
        <line x1="18" y1="38" x2="50" y2="32.5" stroke-dasharray="6 2 16 1.5 4 1" />
        <line x1="19" y1="46" x2="51" y2="40.2" stroke-dasharray="10 1.5 8 1.5 5 1" />
        <line x1="20" y1="53" x2="46" y2="47.5" stroke-dasharray="12 1.5 6 1" />
      </g>

      <!-- Torn notch cracks and paper fibers -->
      <path d="M 28.5 15.2 L 29 18.5 L 28 20.5" fill="none" stroke="#22201d" stroke-width="0.85" stroke-linecap="round" />
      <line x1="31.8" y1="13.5" x2="31.2" y2="16" stroke="#4a453f" stroke-width="0.55" stroke-linecap="round" />
      <line x1="9.5" y1="25.5" x2="14" y2="25.8" stroke="#22201d" stroke-width="0.8" stroke-linecap="round" />
      <!-- Tiny fiber wisps near tears -->
      <line x1="27.5" y1="12.8" x2="28.2" y2="14.5" stroke="#756f66" stroke-width="0.45" />
      <line x1="30" y1="12.2" x2="29.6" y2="13.8" stroke="#756f66" stroke-width="0.45" />

      <!-- Gentle 3D cylindrical paper surface curvature lines (微卷曲弧度) -->
      <g stroke="#5c554c" stroke-width="0.55" stroke-linecap="round" opacity="0.24">
        <path d="M 15 28 C 24 25, 34 22, 44 20" fill="none" />
        <path d="M 16 36 C 25 33, 35 30, 45 28" fill="none" />
        <path d="M 18 44 C 27 41, 37 38, 47 35" fill="none" />
      </g>

      <!-- Soft graphite shading on the receding right edge (giving 3D lighting depth) -->
      <path 
        d="M 52 9.2 C 52.8 18, 53.8 32, 54.8 47.8 L 50 48.6 C 49 33, 48 19, 47 10.1 Z" 
        fill="#221e1a" 
        opacity="0.04" 
      />
    </g>
  </g>
</svg>