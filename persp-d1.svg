<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="d1-stroke" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08 0.12" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.8" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="d1-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="2.5" stdDeviation="1.6" flood-color="#1f1c19" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#d1-stroke)">
    <!-- 3D Perspective Ambient Shadow (falls back and right) -->
    <path 
      d="M 12 28 
         C 24 23, 38 18, 52 14
         C 53.5 24, 55 34, 56 42
         C 43 47, 30 52, 17 58
         C 14 47, 13 37, 12 28
         Z" 
      fill="#1c1917" 
      opacity="0.09" 
      transform="translate(1.5, 3)"
    />

    <!-- 
      MAIN PAPER SHEET:
      Tilted towards Front-Left in 3D space:
      - Front-left is closest to camera (larger, lower, extends forward)
      - Back-right recedes into depth (smaller, higher)
      - Front-left edge has a gentle natural paper curl/lift (轻微卷曲)
      - Top edge has a natural pencil tear notch (一点破损)
      - Bottom-right corner has NO fold (已删除折角)
    -->
    <path 
      d="M 10.5 26.5 
         C 16 23.5, 23 20.5, 28.5 18.5
         L 30 22
         L 31.8 17.5
         L 33.5 20
         L 35 16.8
         C 41 15, 47 13.5, 52.8 12.5
         C 53.8 22, 54.6 31.5, 55.5 41
         C 43.5 46.5, 31 51.8, 17.5 56.5
         C 15 55.5, 12.8 54, 11 52
         C 11.5 44, 10.8 35, 10.5 26.5
         Z" 
      fill="#FAF7F0" 
      stroke="#24211d" 
      stroke-width="1.35" 
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Paper thickness edge along the front-left rim (closest to viewer in 3D) -->
    <path 
      d="M 10.5 26.5 L 10 27.2 C 10.4 35.5, 11 44.5, 10.5 52.6 L 11 52 Z" 
      fill="#DDD6C7" 
      stroke="#24211d" 
      stroke-width="0.5" 
    />
    <path 
      d="M 11 52 C 12.8 54, 15 55.5, 17.5 56.5 L 17.2 57.2 C 14.5 56.2, 12.2 54.6, 10.5 52.6 Z" 
      fill="#C8C1B0" 
      stroke="#24211d" 
      stroke-width="0.5" 
    />

    <!-- Secondary sketchy contour line (double-stroke graphite) -->
    <path 
      d="M 11.2 27.2 
         C 16.5 24.2, 23.5 21.2, 28 19.2
         M 35.6 17.5
         C 41.5 15.6, 47.2 14.2, 52.2 13.2
         C 53.2 22.5, 54 31.8, 54.8 40.5
         C 43 45.8, 30.8 51, 18 55.8
         C 15.5 54.8, 13.5 53.4, 11.8 51.5
         C 12.2 43.8, 11.5 35.2, 11.2 27.2" 
      fill="none" 
      stroke="#4c4740" 
      stroke-width="0.65" 
      stroke-linecap="round"
      opacity="0.75" 
    />

    <!-- Torn edge details (tear crack and frayed fibers) -->
    <path d="M 30 22 L 30.5 25.5 L 29.5 27.5" fill="none" stroke="#24211d" stroke-width="0.85" stroke-linecap="round" />
    <line x1="33.5" y1="20" x2="33" y2="22.5" stroke="#4c4740" stroke-width="0.55" stroke-linecap="round" />
    <line x1="28.8" y1="19.5" x2="29.6" y2="21.2" stroke="#756f66" stroke-width="0.45" />
    <line x1="34.2" y1="18.2" x2="33.8" y2="19.8" stroke="#756f66" stroke-width="0.45" />

    <!-- A small torn nick on left front edge -->
    <path d="M 10.6 40 L 9 41.2 L 10.8 42.5" fill="#FAF7F0" stroke="#24211d" stroke-width="1.1" stroke-linejoin="round" />
    <line x1="9" y1="41.2" x2="13.2" y2="41.5" stroke="#24211d" stroke-width="0.7" stroke-linecap="round" />

    <!-- 
      PERSPECTIVE RULED GUIDELINES
      Converging towards the right vanishing point in 3D
    -->
    <g stroke="#686158" stroke-width="0.65" stroke-linecap="round" opacity="0.36">
      <line x1="12.5" y1="33" x2="52.5" y2="19" stroke-dasharray="8 2 12 1.5 6 1" />
      <line x1="12.8" y1="33.3" x2="49" y2="19.6" stroke-width="0.4" opacity="0.25" />

      <line x1="13.5" y1="39.5" x2="53" y2="25" stroke-dasharray="14 1.5 5 2 8 1" />
      <line x1="14.5" y1="46" x2="53.8" y2="31" stroke-dasharray="6 2 16 1.5 4 1" />
      <line x1="15.8" y1="52.2" x2="54.5" y2="37" stroke-dasharray="10 1.5 8 1.5 5 1" />
    </g>

    <!-- 
      3D QUADRANT AXES (上下左右前后 象限参考线)
      Drawn in faint pencil sketch on the paper surface
      X-axis (左右), Y-axis (上下), Z-axis (前后透视轴)!
    -->
    <g stroke="#48423a" stroke-width="0.65" stroke-linecap="round" opacity="0.32">
      <!-- Perspective Center Point -->
      <circle cx="33" cy="35" r="1.5" fill="#24211d" />

      <!-- Horizontal Axis (左右象限) in perspective -->
      <line x1="18" y1="41" x2="48" y2="29" stroke-dasharray="2 1.5" />
      <!-- Vertical Axis (上下象限) in perspective -->
      <line x1="34.5" y1="20" x2="31.5" y2="50" stroke-dasharray="2 1.5" />
      <!-- Depth Axis (前后透视轴 / Z象限) -->
      <line x1="24" y1="26" x2="42" y2="44" stroke-dasharray="1 2" stroke-width="0.5" opacity="0.25" />
    </g>

    <!-- Gentle upward curl / wave shading along the front-left bottom edge -->
    <!-- The paper curves slightly upward towards the front-left corner -->
    <path 
      d="M 11 52 C 12.8 54, 15 55.5, 17.5 56.5" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="0.9" 
      stroke-linecap="round" 
      opacity="0.5" 
    />
    <g stroke="#554f46" stroke-width="0.6" stroke-linecap="round" opacity="0.25">
      <line x1="13" y1="50" x2="15.5" y2="53.5" />
      <line x1="15" y1="51.5" x2="18" y2="54.5" />
      <line x1="17.5" y1="52.5" x2="20.5" y2="55.2" />
    </g>
  </g>
</svg>