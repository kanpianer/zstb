<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Organic pencil stroke filter for graphite hand-drawn texture -->
    <filter id="pencil-stroke-persp" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08 0.12" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.85" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <g filter="url(#pencil-stroke-persp)">
    <!-- 3D Perspective Cast Shadow behind paper onto transparent desk -->
    <path 
      d="M 13 13 
         C 25 12, 38 15, 51 18
         C 49 32, 47 44, 46 54
         C 33 55, 21 57, 12 58
         C 12 43, 12 28, 13 13
         Z" 
      fill="#1c1917" 
      opacity="0.09" 
      transform="translate(1.6, 2.5)"
    />

    <!-- 
      MAIN PAPER BODY (Portrait sheet tilted towards Front-Left in 3D Perspective)
      - Front-left edge: closest to viewer (x=12..12.5, y=12..55, height=43)
      - Back-right edge: further away in perspective (x=48..49, y=17..51, height=34)
      - Top edge: slopes from (12.5, 12) down-right to (49, 17) in perspective
      - Bottom edge: slopes from (12, 55) up-right to (46, 51) in perspective
      - Curvature (轻微卷曲): natural subtle curved flex along the front edge and top edge
      - Torn edge (一点破损): torn notch with fiber wisps at top edge near x=27..32
      - Corner fold: COMPLETELY REMOVED from bottom right!
    -->
    <path 
      d="M 12.5 12 
         C 17 11.5, 22 12.2, 26.5 13.2
         L 28 16.5
         L 29.8 12.8
         L 31.5 15.2
         L 33 12.8
         C 38 14.2, 43.5 15.6, 49 17.2
         C 48.2 28.5, 47.2 40, 46.2 51.2
         C 34.5 52.8, 23 54.2, 12 55.5
         C 11.2 41, 11.8 26.5, 12.5 12
         Z" 
      fill="#FAF7F0" 
      stroke="#24211d" 
      stroke-width="1.35" 
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Paper thickness edge along the front-left rim (closest 3D edge to camera) -->
    <path 
      d="M 12.5 12 L 11.8 12.8 C 11.1 27, 10.5 41.5, 11.3 56.2 L 12 55.5 Z" 
      fill="#DDD6C7" 
      stroke="#24211d" 
      stroke-width="0.5" 
      stroke-linejoin="round"
    />
    <path 
      d="M 11.3 56.2 L 12 55.5 C 23 54.2, 34.5 52.8, 46.2 51.2 L 45.8 51.8 C 34.2 53.4, 22.8 54.8, 11.3 56.2 Z" 
      fill="#C8C1B0" 
      stroke="#24211d" 
      stroke-width="0.5" 
      stroke-linejoin="round"
    />

    <!-- Secondary sketch line (pencil overlapping double contour) -->
    <path 
      d="M 13.2 12.8 
         C 17.5 12.2, 22.2 13, 26 13.8
         M 33.8 13.5
         C 38.5 14.8, 43.8 16.2, 48.2 17.8
         C 47.5 28.8, 46.5 40.2, 45.5 50.5
         C 34 52.2, 22.8 53.6, 12.8 54.8
         C 12.1 40.5, 12.6 26.8, 13.2 12.8" 
      fill="none" 
      stroke="#4c4740" 
      stroke-width="0.65" 
      stroke-linecap="round"
      opacity="0.75" 
    />

    <!-- Torn edge details (fracture crack and fine paper fibers) -->
    <path d="M 28 16.5 L 28.5 20 L 27.5 22.2" fill="none" stroke="#24211d" stroke-width="0.85" stroke-linecap="round" />
    <line x1="31.5" y1="15.2" x2="31" y2="17.8" stroke="#4c4740" stroke-width="0.55" stroke-linecap="round" />
    <line x1="26.8" y1="14" x2="27.5" y2="15.6" stroke="#756f66" stroke-width="0.45" />
    <line x1="32.2" y1="13.5" x2="31.8" y2="15" stroke="#756f66" stroke-width="0.45" />

    <!-- A small torn nick on front-left margin -->
    <path d="M 11.8 33 L 10 34.2 L 12 35.5" fill="#FAF7F0" stroke="#24211d" stroke-width="1.1" stroke-linejoin="round" />
    <line x1="10" y1="34.2" x2="14.2" y2="34.5" stroke="#24211d" stroke-width="0.7" stroke-linecap="round" />

    <!-- 
      Perspective notebook ruling lines
      Converging towards the right vanishing point
    -->
    <g stroke="#686158" stroke-width="0.65" stroke-linecap="round" opacity="0.35">
      <line x1="14" y1="21" x2="47.5" y2="24" stroke-dasharray="8 2 12 1.5 6 1" />
      <line x1="14" y1="28" x2="47" y2="30.5" stroke-dasharray="14 1.5 5 2 8 1" />
      <line x1="13.8" y1="35.5" x2="46.5" y2="37.5" stroke-dasharray="6 2 16 1.5 4 1" />
      <line x1="13.5" y1="43" x2="46" y2="44.2" stroke-dasharray="10 1.5 8 1.5 5 1" />
      <line x1="13" y1="50" x2="45.5" y2="50" stroke-dasharray="12 1.5 6 1" />
    </g>

    <!-- 
      3D QUADRANTS AXIS SYSTEM (上下左右前后 象限系统)
      Faint pencil drafting lines on paper representing the quadrants:
      - X-axis: 左右象限
      - Y-axis: 上下象限
      - Z-axis: 前后象限 (depth foreshortened axis)
    -->
    <g stroke="#3d3730" stroke-width="0.65" stroke-linecap="round" opacity="0.3">
      <!-- Quadrants Origin Point -->
      <circle cx="29.5" cy="36" r="1.5" fill="#24211d" />

      <!-- Horizontal Axis (左右象限) -->
      <line x1="17" y1="37" x2="42" y2="35" stroke-dasharray="2 1.5" />
      <!-- Vertical Axis (上下象限) -->
      <line x1="28" y1="22" x2="31" y2="49" stroke-dasharray="2 1.5" />
      <!-- Depth Axis (前后透视象限 Z轴) -->
      <line x1="22" y1="43" x2="37" y2="28" stroke-dasharray="1.5 2" stroke-width="0.5" opacity="0.25" />
    </g>

    <!-- Subtle pencil curved hatch lines showing gentle paper curvature/curl -->
    <g stroke="#554f46" stroke-width="0.5" stroke-linecap="round" opacity="0.2">
      <path d="M 16 48 C 18 51, 21 53, 24 54" fill="none" />
      <path d="M 20 48.5 C 22 51, 25 52.8, 28 53.5" fill="none" />
      <path d="M 38 21 C 41 23, 44 24.5, 46 25" fill="none" />
    </g>
  </g>
</svg>