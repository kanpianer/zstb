<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Organic pencil stroke displacement filter -->
    <filter id="pencil-tilt-stroke" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08 0.12" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.8" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <!-- Soft 3D graphite shadow cast on desk (shifted to back-right because paper tilts left-front) -->
    <filter id="paper-3d-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1.8" dy="2.2" stdDeviation="1.6" flood-color="#1e1b18" flood-opacity="0.28" />
    </filter>
  </defs>

  <g filter="url(#pencil-tilt-stroke)">
    <!-- 
      3D Perspective Projected Paper:
      Paper tilted toward left-front:
      - Top-Left corner: closer to front, e.g. around (10, 14)
      - Bottom-Left corner: closest to viewer, e.g. around (14, 57)
      - Top-Right corner: recedes in depth, e.g. around (52, 9)
      - Bottom-Right corner: intact (NO FOLD), recedes slightly, e.g. around (55, 48)
      - Gentle cylindrical curvature/wave across the sheet (微卷曲):
        Top edge curves gently: (10, 14) -> (52, 9)
        Bottom edge curves gently: (14, 57) -> (55, 48)
        Left edge bows slightly forward: (10, 14) -> (14, 57)
        Right edge curves back: (52, 9) -> (55, 48)
    -->

    <!-- Ambient graphite desk shadow under the floating tilted paper -->
    <path 
      d="M 12 18 
         L 51 13 
         L 55 49 
         L 16 57 
         Z" 
      fill="#1c1917" 
      opacity="0.1" 
      transform="translate(1.8, 2.5)"
    />

    <!-- Main Paper Body Fill & Contour -->
    <g filter="url(#paper-3d-shadow)">
      <path 
        d="M 10.5 14.8 
           C 16 13.5, 22 12.5, 27 12
           L 28.5 15.2
           L 30.2 11.5
           L 31.8 13.5
           L 33 11.2
           C 40 10.2, 46 9.6, 52 9.2
           C 52.8 18, 53.8 32, 54.8 47.8
           C 46 49.5, 36 51.5, 26 53.8
           L 24.8 52
           L 23.5 54.2
           C 19.5 55.2, 16 56, 13.8 56.8
           C 12.8 45, 12 33, 11.2 27
           L 9.5 25.5
           L 11.4 24
           C 11 20, 10.7 17, 10.5 14.8
           Z" 
        fill="#FAF7F0" 
        stroke="#24211d" 
        stroke-width="1.35" 
        stroke-linejoin="round"
        stroke-linecap="round"
      />

      <!-- Secondary overlapping sketch contour (pencil double-pass) -->
      <path 
        d="M 11.2 15.4 
           C 16.5 14.2, 22.2 13.2, 26.5 12.6
           M 33.5 11.8
           C 40.2 10.8, 46.2 10.2, 51.5 9.8
           C 52.2 18.5, 53.2 32, 54.2 47.2
           C 46 49, 36.2 51, 26.2 53.2
           M 23 53.8
           C 19.5 54.8, 16 55.6, 14.2 56.2
           C 13.2 45, 12.5 33, 11.8 27.5
           M 11.8 23.5
           C 11.5 20, 11.2 17.2, 11 15.4" 
        fill="none" 
        stroke="#4c4740" 
        stroke-width="0.65" 
        stroke-linecap="round"
        opacity="0.75"
      />

      <!-- Natural curl curve shading / graphite gradient along the paper surface -->
      <!-- Left side is lifted/tilted forward, subtle shading under the slight roll -->
      <path 
        d="M 10.5 14.8 C 11.5 28, 12.5 42, 13.8 56.8 C 17 56, 20 55, 23 54.2 C 21 40, 19 26, 17 14 C 14.5 14.2, 12.5 14.5, 10.5 14.8 Z" 
        fill="#26221e" 
        opacity="0.04" 
      />

      <!-- Tears, notch, and cracks -->
      <!-- Top tear crack extending inward -->
      <path d="M 28.5 15.2 L 29 18.5 L 28 20.5" fill="none" stroke="#24211d" stroke-width="0.85" stroke-linecap="round" />
      <line x1="31.8" y1="13.5" x2="31.2" y2="16" stroke="#4c4740" stroke-width="0.55" stroke-linecap="round" />
      <!-- Left notch crack -->
      <line x1="9.5" y1="25.5" x2="14" y2="25.8" stroke="#24211d" stroke-width="0.8" stroke-linecap="round" />

      <!-- Ruled pencil guidelines in 3D perspective (receding towards top-right) -->
      <g stroke="#6d665e" stroke-width="0.65" stroke-linecap="round" opacity="0.32">
        <!-- Line 1 -->
        <line x1="16" y1="22" x2="48" y2="17.2" stroke-dasharray="8 2 12 1.5 6 1" />
        <!-- Line 2 -->
        <line x1="17" y1="30" x2="49" y2="24.8" stroke-dasharray="14 1.5 6 2 8 1" />
        <!-- Line 3 -->
        <line x1="18" y1="38" x2="50" y2="32.5" stroke-dasharray="6 2 16 1.5 4 1" />
        <!-- Line 4 -->
        <line x1="19" y1="46" x2="51" y2="40.2" stroke-dasharray="10 1.5 8 1.5 5 1" />
        <!-- Line 5 -->
        <line x1="20" y1="53" x2="46" y2="47.5" stroke-dasharray="12 1.5 6 1" />
      </g>

      <!-- Delicate pencil curvature lines across the paper body showing the 3D paper curl (微卷曲) -->
      <g stroke="#5c554c" stroke-width="0.55" stroke-linecap="round" opacity="0.22">
        <path d="M 15 28 C 24 25, 34 22, 44 20" fill="none" />
        <path d="M 16 36 C 25 33, 35 30, 45 28" fill="none" />
        <path d="M 18 44 C 27 41, 37 38, 47 35" fill="none" />
      </g>
    </g>
  </g>
</svg>