<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Built-in organic pencil stroke filter -->
    <filter id="pencil-stroke" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08 0.12" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.85" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <!-- Soft 3D perspective shadow -->
    <filter id="perspective-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="2.8" stdDeviation="1.6" flood-color="#1f1c19" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#pencil-stroke)">
    <!-- 3D Perspective Cast Shadow on desk (transparent canvas) -->
    <path 
      d="M 12 17 
         C 24 13.5, 38 11.5, 52 13.5
         C 50.8 28.5, 49.2 43, 47.5 54
         C 34.5 56, 21.5 57.2, 10 57.5
         C 10 44, 11 30.5, 12 17
         Z" 
      fill="#1c1917" 
      opacity="0.09" 
      transform="translate(2, 2.8)"
    />

    <!-- 
      MAIN PAPER SHEET:
      Tilted towards Front-Left in 3D Perspective (整体向左前方倾斜，呈现出纸张透视关系)
      - Front-Left vertical edge is closer to camera (height ~ 44, x ~ 9.5..12.5)
      - Back-Right vertical edge recedes into depth (height ~ 36, x ~ 47..51.5)
      - Top edge slopes down-right in perspective: (12.2, 12.5) -> (51.5, 15.5)
      - Bottom edge slopes up-right in perspective: (9.8, 56.5) -> (46.8, 51.5)
      - Gentle paper curvature / curl across surface (轻微卷曲)
      - Torn rip on top edge near x=27..32 with fine cracks (一点破损)
      - NO bottom-right fold (已删除折角，自然展开)
    -->
    <path 
      d="M 12.2 12.5 
         C 17 11.8, 22.5 11.5, 27 12
         L 28.5 15.5
         L 30.2 11.8
         L 32 14.2
         L 33.5 11.8
         C 39.5 12.8, 45.5 14, 51.5 15.5
         C 50.2 27.5, 48.8 39.5, 46.8 51.5
         C 34.5 53.2, 22 55, 9.8 56.5
         C 10.2 42, 11.2 27, 12.2 12.5
         Z" 
      fill="#FAF7F0" 
      stroke="#24211d" 
      stroke-width="1.35" 
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- 3D paper thickness edge along front-left rim (closest edge to viewer) -->
    <path 
      d="M 12.2 12.5 L 11.4 13.2 C 10.4 27.8, 9.4 42.5, 9 57.2 L 9.8 56.5 Z" 
      fill="#DDD6C7" 
      stroke="#24211d" 
      stroke-width="0.5" 
      stroke-linejoin="round" 
    />
    <path 
      d="M 9 57.2 L 9.8 56.5 C 22 55, 34.5 53.2, 46.8 51.5 L 46.2 52.2 C 34 53.8, 21.6 55.6, 9 57.2 Z" 
      fill="#C8C1B0" 
      stroke="#24211d" 
      stroke-width="0.5" 
      stroke-linejoin="round" 
    />

    <!-- Secondary sketch contour line (pencil double-pass graphite line) -->
    <path 
      d="M 12.8 13.2 
         C 17.5 12.5, 22.8 12.2, 26.5 12.6
         M 34.2 12.5
         C 40 13.5, 45.8 14.6, 50.8 16.2
         C 49.5 27.8, 48.2 39.8, 46.2 50.8
         C 34 52.6, 21.8 54.2, 10.5 55.8
         C 10.9 41.5, 11.8 27.2, 12.8 13.2" 
      fill="none" 
      stroke="#4c4740" 
      stroke-width="0.65" 
      stroke-linecap="round"
      opacity="0.75" 
    />

    <!-- Torn edge details (fracture crack and fine paper fibers) -->
    <path d="M 28.5 15.5 L 29 19 L 28 21.2" fill="none" stroke="#24211d" stroke-width="0.85" stroke-linecap="round" />
    <line x1="32" y1="14.2" x2="31.5" y2="17" stroke="#4c4740" stroke-width="0.55" stroke-linecap="round" />
    <line x1="27.2" y1="13" x2="28" y2="14.6" stroke="#756f66" stroke-width="0.45" />
    <line x1="32.8" y1="12.6" x2="32.2" y2="14.2" stroke="#756f66" stroke-width="0.45" />

    <!-- A small torn nick on front-left margin -->
    <path d="M 11.2 34 L 9.5 35.2 L 11.5 36.5" fill="#FAF7F0" stroke="#24211d" stroke-width="1.1" stroke-linejoin="round" />
    <line x1="9.5" y1="35.2" x2="13.8" y2="35.5" stroke="#24211d" stroke-width="0.7" stroke-linecap="round" />

    <!-- 
      Perspective notebook ruling lines
      Converging towards the right vanishing point
    -->
    <g stroke="#686158" stroke-width="0.65" stroke-linecap="round" opacity="0.36">
      <line x1="12.8" y1="21.5" x2="50" y2="22.5" stroke-dasharray="8 2 12 1.5 6 1" />
      <line x1="12.2" y1="28.5" x2="49.2" y2="29.5" stroke-dasharray="14 1.5 5 2 8 1" />
      <line x1="11.8" y1="35.5" x2="48.5" y2="36.5" stroke-dasharray="6 2 16 1.5 4 1" />
      <line x1="11.2" y1="42.5" x2="47.8" y2="43.5" stroke-dasharray="10 1.5 8 1.5 5 1" />
      <line x1="10.8" y1="49.5" x2="47.2" y2="50" stroke-dasharray="12 1.5 6 1" />
    </g>

    <!-- 
      3D QUADRANTS AXIS SYSTEM (上下左右前后 3D 象限系统)
      Faint pencil drafting lines on paper representing the quadrants:
      - X-axis: 左右象限
      - Y-axis: 上下象限
      - Z-axis: 前后象限 (depth foreshortened axis)
    -->
    <g stroke="#3d3730" stroke-width="0.65" stroke-linecap="round" opacity="0.25">
      <!-- Horizontal Axis (左右象限) in perspective -->
      <line x1="16" y1="36.8" x2="44" y2="36" stroke-dasharray="2 1.5" />
      <!-- Vertical Axis (上下象限) in perspective -->
      <line x1="27.5" y1="20" x2="29.5" y2="51" stroke-dasharray="2 1.5" />
      <!-- Depth Axis (前后透视象限 Z轴) -->
      <line x1="20" y1="44" x2="38" y2="28" stroke-dasharray="1.5 2" stroke-width="0.5" opacity="0.2" />
    </g>

    <!-- Subtle pencil curved hatch lines showing gentle paper curvature/curl -->
    <g stroke="#554f46" stroke-width="0.5" stroke-linecap="round" opacity="0.2">
      <path d="M 14 49 C 17 52, 20 54, 24 55" fill="none" />
      <path d="M 18 49.5 C 21 52, 24 53.8, 28 54.5" fill="none" />
      <path d="M 40 20 C 43 21.5, 46 22.8, 48 23.5" fill="none" />
    </g>
  </g>
</svg>