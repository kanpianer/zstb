<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="d2-stroke" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08 0.12" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.8" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <g filter="url(#d2-stroke)">
    <!-- Ambient desk shadow -->
    <path 
      d="M 10 24 
         C 24 18, 38 14, 53 10
         C 55 21, 56.5 32, 57.5 42
         C 44 48, 30 54, 15 59
         C 12 47, 10.8 35, 10 24
         Z" 
      fill="#1c1917" 
      opacity="0.09" 
      transform="translate(1.5, 2.8)"
    />

    <!-- Main Paper Body: Front-left corner extends closest to camera -->
    <path 
      d="M 9.5 22 
         C 16 19, 23 16.5, 28 15
         L 29.5 18.5
         L 31.2 14.2
         L 32.8 16.5
         L 34.2 13.5
         C 40.5 12, 47 10.5, 53.5 9.5
         C 54.5 19.5, 55.5 30, 56.5 40
         C 44 46, 30 52, 16 57
         C 13.5 45, 11 33, 9.5 22
         Z" 
      fill="#FAF7F0" 
      stroke="#24211d" 
      stroke-width="1.35" 
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Double sketch line -->
    <path 
      d="M 10.2 22.8 
         C 16.5 19.8, 23.5 17.2, 27.5 15.8
         M 35 14.2
         C 41 12.8, 47.2 11.2, 52.8 10.2
         C 53.8 20, 54.8 30.2, 55.8 39.5
         C 43.5 45.2, 29.8 51.2, 16.5 56.2
         C 14.2 44.5, 11.8 33, 10.2 22.8" 
      fill="none" 
      stroke="#4c4740" 
      stroke-width="0.65" 
      stroke-linecap="round"
      opacity="0.75" 
    />

    <!-- Tear crack -->
    <path d="M 29.5 18.5 L 30 22 L 29 24.2" fill="none" stroke="#24211d" stroke-width="0.85" stroke-linecap="round" />
    <line x1="32.8" y1="16.5" x2="32.2" y2="19.2" stroke="#4c4740" stroke-width="0.55" stroke-linecap="round" />

    <!-- Left margin tear nick -->
    <path d="M 11.5 37 L 9.8 38.5 L 12 39.8" fill="#FAF7F0" stroke="#24211d" stroke-width="1.1" stroke-linejoin="round" />
    <line x1="9.8" y1="38.5" x2="13.8" y2="38.8" stroke="#24211d" stroke-width="0.7" stroke-linecap="round" />

    <!-- Perspective Ruled Lines -->
    <g stroke="#686158" stroke-width="0.65" stroke-linecap="round" opacity="0.36">
      <line x1="12" y1="29" x2="54" y2="16" stroke-dasharray="8 2 12 1.5 6 1" />
      <line x1="13" y1="36" x2="54.5" y2="22.5" stroke-dasharray="14 1.5 5 2 8 1" />
      <line x1="14" y1="43" x2="55.2" y2="29" stroke-dasharray="6 2 16 1.5 4 1" />
      <line x1="15" y1="50" x2="55.8" y2="35" stroke-dasharray="10 1.5 8 1.5 5 1" />
    </g>

    <!-- Faint 3D Quadrant axes (上下左右前后 3D 坐标象限) -->
    <g stroke="#48423a" stroke-width="0.65" stroke-linecap="round" opacity="0.32">
      <circle cx="34" cy="33" r="1.5" fill="#24211d" />
      <line x1="18" y1="39" x2="50" y2="27" stroke-dasharray="2 1.5" />
      <line x1="35.5" y1="17" x2="32.5" y2="48" stroke-dasharray="2 1.5" />
    </g>

    <!-- Gentle paper curvature / curl along front-left edge -->
    <!-- The paper edge lifts slightly in 3D -->
    <path 
      d="M 16 57 C 22 55.5, 28 53.5, 33 51" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="0.8" 
      stroke-linecap="round" 
      opacity="0.4" 
    />
  </g>
</svg>